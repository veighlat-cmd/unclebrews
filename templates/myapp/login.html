
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Uncle Brews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
        background: linear-gradient(135deg, #ffc107 0%, #ff8c00 100%); /* Logo gradient */
            background: linear-gradient(135deg,  0%, #fdf5e6 100%); /* Light beige/cream gradient */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        /* Coffee bean scattered pattern */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 69, 19, 0.15) 3px, transparent 3px),
                radial-gradient(circle at 80% 20%, rgba(139, 69, 19, 0.12) 2.5px, transparent 2.5px),
                radial-gradient(circle at 40% 70%, rgba(139, 69, 19, 0.18) 2.8px, transparent 2.8px),
                radial-gradient(circle at 90% 80%, rgba(139, 69, 19, 0.15) 3.2px, transparent 3.2px),
                radial-gradient(circle at 10% 90%, rgba(139, 69, 19, 0.12) 2.2px, transparent 2.2px),
                radial-gradient(circle at 60% 10%, rgba(139, 69, 19, 0.2) 3.5px, transparent 3.5px),
                radial-gradient(circle at 30% 50%, rgba(139, 69, 19, 0.15) 2.5px, transparent 2.5px),
                radial-gradient(circle at 70% 60%, rgba(139, 69, 19, 0.18) 3px, transparent 3px);
            background-size: 200px 200px, 150px 150px, 180px 180px, 220px 220px, 160px 160px, 250px 250px, 170px 170px, 190px 190px;
            animation: floatBeans 20s linear infinite;
            z-index: 1;
            pointer-events: none; /* allow clicks through the decorative overlay */
        }
        
        @keyframes floatBeans {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            position: relative; /* create stacking context */
            z-index: 2; /* ensure card sits above the decorative overlay */
        }
        .login-header {
            background: linear-gradient(135deg, #ffc107 0%, #ff8c00 100%); /* Logo gradient */
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .hero-img {
            width: 120px;     
            height: auto;     
            margin-bottom: 10px; 
            }
        
        .login-body {
            padding: 2rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #ffc107 0%, #ff8c00 100%); /* Logo gradient */
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }
        .back-link {
            color: white;
            text-decoration: none;
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.2rem;
            z-index: 3; /* keep back link clickable over overlay */
        }
        .back-link:hover {
            color: #f8f9fa;
        }
    </style>
</head>
<body>
    <a href="{% url 'landing_page' %}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back
    </a>
    
    <div class="login-card">
        <div class="login-header">
             <img src="/static/images/logo.png" alt="Uncle Brews Logo" class="hero-img" />
            </i>
            <h3>Welcome to <span style="color: #8B4513 !important;">Uncle Brews</span></h3>
            <p class="mb-0">Sign in to your account</p>
        </div>
        
        <div class="login-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="identifier" class="form-label">
                        <i class="fas fa-user"></i> Email or Username
                    </label>
                    <input type="hidden" name="next" value="{{ next }}">
                    <input type="text" class="form-control" id="identifier" name="email" placeholder="you@example.com or username" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-login text-white">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-3">
                <p class="mb-0">Don't have an account? 
                    <a href="{% url 'register' %}" style="color: #ffc107; text-decoration: none; font-weight: 600;">
                        Register here
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
