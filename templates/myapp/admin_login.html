<!DOCTYPE html>
<html>
<head>
    <form method="POST" action="">
    {% csrf_token %}

    <title>Admin Login</title>
    <style>
        body {
            background: #FFF3E0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-box {
            width: 350px;
            margin: 120px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #FFA726;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
        }
        button:hover {
            background: #FFB74D;
        }
        .error { color: red; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 style="text-align:center; color:#5C3317;">Admin Login</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </form>
</div>

</body>
</html>
