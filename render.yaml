services:
  - type: web
    name: unclebrews
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn myproject.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: unclebrews-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: unclebrew
      - key: ADMIN_EMAIL
        value: unclebrew@gmail.com
      - key: ADMIN_PASSWORD
        value: 123456789

databases:
  - name: unclebrews-db
    databaseName: unclebrews
    user: unclebrews